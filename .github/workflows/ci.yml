name: ci
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -m pip install -U pip
      - name: Install dev deps
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Unit tests + coverage (>=85%)
        run: pytest -q tests/unit --cov=src --cov-report=xml --cov-fail-under=85
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  quick-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: demo
        # Healthcheck so the job waits until MariaDB is accepting TCP connections
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --protocol=tcp"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      mongo:
        image: mongo:6
        # You only need ports if the runner must talk via host networking; Actions services auto-network.
        # Keeping them commented to avoid port collisions on self-hosted runners.
        # ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -U pip
      - run: pip install ".[dev]"
      - name: Smoke (Pandas → MariaDB)
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
          # MARIADB_PORT defaults to 3306 in your code; set explicitly if you prefer:
          # MARIADB_PORT: 3306
        run: python scripts/smoke_ci.py
      - name: Integration tests (optional, if you have any)
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
        run: pytest -q tests/integration || true  # remove `|| true` if these should be required
