name: ci
on:
  push:
    branches: [main]          # no push runs for feature branches
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: python -m pip install -U pip
      # EITHER: editable install + keep --cov=src/...
      - name: Install dev deps (editable)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Unit tests + coverage (>=85%)
        run: pytest -q tests/unit --cov=src/batch_pipeline --cov-report=xml:coverage.xml --cov-fail-under=85
      # If you prefer non-editable installs, swap the two steps above for:
      #   run: pip install ".[dev]"
      #   run: pytest -q tests/unit --cov=batch_pipeline --cov-report=xml:coverage.xml --cov-fail-under=85
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  quick-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: demo
        ports: ["3306:3306"]              # publish so 127.0.0.1:3306 works from the runner
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --protocol=tcp || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=120
          --health-start-period=60s
      mongo:
        image: mongo:6
        # No ports needed for this job, we don't talk to Mongo from host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -U pip
      - run: pip install ".[dev]"
      - name: Smoke (Pandas → MariaDB)
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
          MARIADB_PORT: 3306
        run: python scripts/smoke_ci.py
      - name: Integration tests (optional)
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
          MARIADB_PORT: 3306
        run: pytest -q tests/integration
