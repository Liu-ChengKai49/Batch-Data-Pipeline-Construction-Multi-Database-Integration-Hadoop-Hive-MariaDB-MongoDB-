name: ci
on: [push, pull_request]
jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    strategy: { matrix: { python-version: ["3.10","3.11"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: ${{ matrix.python-version }} }
      - run: python -m pip install -U pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q tests/unit --cov=src --cov-fail-under=85

  quick-integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: demo }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=3s --health-retries=30
      mongo:
        image: mongo:6
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install -U pip
      - run: pip install ".[dev]"
      - name: Smoke (Pandas->MariaDB)
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
        run: python scripts/smoke_ci.py
      - name: Integration tests
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
        run: pytest -q tests/integration
