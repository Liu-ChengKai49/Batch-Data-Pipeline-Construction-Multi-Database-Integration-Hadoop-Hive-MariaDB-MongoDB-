name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - name: Install dev deps (editable)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Unit tests + coverage (>=85%)
        run: pytest -q tests/unit --cov=src/batch_pipeline --cov=src/dq --cov-report=xml:coverage.xml --cov-fail-under=85
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml 
          
  quick-integration:
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: market
        ports: ["3306:3306"]
        # options: >-
        #   --health-cmd="mysqladmin ping -proot"
        #   --health-interval=5s --health-timeout=3s --health-retries=60
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        # options: >-
        #   --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1})' || exit 1"
        #   --health-interval=5s --health-timeout=3s --health-retries=60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"  # ensure this includes sql/mongo clients (e.g., mysql-connector-python, pymongo)

      - name: Install mysql client (for mysqladmin + mysql)
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Wait for MariaDB & MongoDB (max ~180s)
        shell: bash
        run: |
          for i in {1..90}; do
            MUP=$((echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1; echo $?)
            MGP=$((echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; echo $?)
            if [[ "$MUP" == "0" && "$MGP" == "0" ]]; then
              echo "MariaDB & MongoDB ports are open on attempt $i"
              # optional extra: confirm MariaDB is truly ready
              mysqladmin --connect-timeout=2 ping -h 127.0.0.1 -P 3306 -uroot -proot --protocol=tcp --silent && exit 0
            fi
            echo "Waiting... ($i/90)"; sleep 2
          done
          echo "Services not healthy"; exit 1

      - name: Seed MariaDB
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -D market < data/seed_mariadb.sql

      - name: Seed MongoDB (via pymongo)
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
        run: |
          python - <<'PY'
          import json, os, pymongo

          uri = os.getenv("MONGODB_URI", "mongodb://127.0.0.1:27017")
          client = pymongo.MongoClient(uri, serverSelectionTimeoutMS=5000)

          # Confirm server is reachable
          client.admin.command("ping")

          db = client["market"]

          # Load docs
          with open("data/seed_mongo.json", "r", encoding="utf-8") as f:
              docs = json.load(f)
          if isinstance(docs, dict):
              docs = [docs]

          # Reset / insert
          col = db.get_collection("raw")
          col.drop()
          db.create_collection("raw")
          col = db.get_collection("raw")
          result = col.insert_many(docs)

          print("Seeded Mongo:", col.count_documents({}), "docs, inserted ids:", len(result.inserted_ids))
          client.close()
          PY

      - name: Run ETL mini
        env:
          PYTHONPATH: src
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: "3306"
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: market
          MONGODB_URI: mongodb://127.0.0.1:27017/market
        run: |
          python -m tools.etl_mini

      - name: Integration tests (RC/PK/NULLs/schema/mongo) + coverage
        env:
          PYTHONPATH: src
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: "3306"
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: market
          MONGODB_URI: mongodb://127.0.0.1:27017/market
        run: |
          pytest -q tests/integration \
            --cov=batch_pipeline \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=85

      - name: Run DQ with freshness gate
        env:
          PYTHONPATH: src
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: "3306"
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: market
          DQ_FRESHNESS_DAYS: "7"
        run: |
          python -m dq.run_checks

