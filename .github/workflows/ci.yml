name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - name: Install dev deps (editable)
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Unit tests + coverage (>=85%)
        run: pytest -q tests/unit --cov=src/batch_pipeline --cov-report=xml:coverage.xml --cov-fail-under=85
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml 
  quick-integration:
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: demo
        # no ports, no healthcheck; we'll wait in a step
      mongo:
        image: mongo:6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install ".[dev]"
      - name: Install mysql client (for mysqladmin)
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
      - name: Wait for MariaDB
        run: |
          for i in {1..60}; do
            if mysqladmin ping -h mariadb -uroot -proot --protocol=tcp >/dev/null 2>&1; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready in time"; exit 1
      - name: Smoke (Pandas → MariaDB)
        env:
          MARIADB_HOST: mariadb
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
          MARIADB_PORT: 3306
        run: python scripts/smoke_ci.py
      - name: Integration tests (optional)
        env:
          MARIADB_HOST: mariadb
          MARIADB_USER: root
          MARIADB_PASSWORD: root
          MARIADB_DB: demo
          MARIADB_PORT: 3306
        run: pytest -q tests/integration
