name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: docker build -f docker/etl.Dockerfile -t ghcr.io/${{ github.repository_owner }}/batch-etl:${GITHUB_REF_NAME} .
      - name: Push
        run: docker push ghcr.io/${{ github.repository_owner }}/batch-etl:${GITHUB_REF_NAME}
