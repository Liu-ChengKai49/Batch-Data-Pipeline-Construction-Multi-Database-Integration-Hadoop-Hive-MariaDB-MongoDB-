name: release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: batch-etl                 # <-- final image name on GHCR
            file: docker/etl.Dockerfile     # <-- path to Dockerfile
            context: .                      # <-- build context
            cache: buildcache-etl           # <-- per-image cache key
          # add more images here if needed (e.g., API, DQ)

    steps:
      - uses: actions/checkout@v4

      - name: Set lower-case owner
        id: repo
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute tags + OCI labels automatically
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/liu-chengkai49/batch-etl
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=commit-
            type=ref,event=tag
            type=semver,pattern={{version}},enable={{is_semver}}
          labels: |
            org.opencontainers.image.title=batch-etl
            org.opencontainers.image.source=https://github.com/Liu-ChengKai49/Batch-Data-Pipeline-Construction-Multi-Database-Integration-Hadoop-Hive-MariaDB-MongoDB-
            org.opencontainers.image.revision=${{ github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}



      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version || '0.0.0' }}
            REVISION=${{ github.sha }}
            REPO_URL=${{ github.server_url }}/${{ github.repository }}
            TITLE=${{ matrix.image.name }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner_lc }}/${{ matrix.image.name }}:${{ matrix.image.cache }}
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner_lc }}/${{ matrix.image.name }}:${{ matrix.image.cache }},mode=max
          provenance: false