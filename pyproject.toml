[project]
name = "batch_pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "hypothesis>=6.98",
  "pymysql>=1.1",         # <— add this line
]
[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Only lint these paths (skip notebooks, dq/, data/, etc.)
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "dq", "data", "hadoop-conf"]

[tool.ruff.lint]
# Keep isort (import sorting) and standard rules
extend-select = ["I"]

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true