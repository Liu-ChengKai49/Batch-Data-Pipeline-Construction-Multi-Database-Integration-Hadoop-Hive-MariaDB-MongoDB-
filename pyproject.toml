[project]
name = "batch_pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "hypothesis>=6.98",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",         # <— add this line
  "pyarrow>=13",        # you already have 13.0.0 in the container
  "requests>=2.31",     # used by WebHDFS uploader
  "yfinance>=0.2.43",   # <-- needed by fetch_ohlcv()
]
[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6.8",
]
hive = [
  "pyhive>=0.7.0",
  "thrift>=0.16",
  "thrift-sasl>=0.4.3",
  "pure-sasl>=0.6.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Only lint these paths (skip notebooks, dq/, data/, etc.)
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "dq", "data", "hadoop-conf"]

[tool.ruff.lint]
# Keep isort (import sorting) and standard rules
extend-select = ["I"]

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true