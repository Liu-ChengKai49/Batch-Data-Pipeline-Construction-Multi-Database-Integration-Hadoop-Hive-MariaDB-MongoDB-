[project]
name = "batch_pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26,<2.0",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "pyarrow>=13",
  "requests>=2.31",
  "yfinance>=0.2.43",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6",
  "mypy>=1.11",
  "ruff>=0.6.8",
  "types-requests>=2.31.0.10",
]
hive = [
  "pyhive>=0.7.0",
  "thrift>=0.16",
  "thrift-sasl>=0.4.3",
  "pure-sasl>=0.6.2",
]
bi = [
  "gspread>=6.0.0",
  "oauth2client>=4.1.3",
  # (optional but handy with gspread)
  "google-auth>=2.30.0",
  "google-auth-oauthlib>=1.2.0",
  "google-api-python-client>=2.127.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "dq", "data", "hadoop-conf"]

[tool.ruff.lint]
extend-select = ["I"]

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
