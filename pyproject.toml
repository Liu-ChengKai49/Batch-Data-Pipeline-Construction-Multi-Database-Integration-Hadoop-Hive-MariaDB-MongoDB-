[project]
name = "batch_pipeline"
version = "0.1.0"
requires-python = ">=3.10"   # align with your container & ruff target
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "numpy>=1.26,<2.0",             # signals/anomaly calcs
  "sqlalchemy>=2.0",
  "pymysql>=1.1",            # MariaDB driver
  "pyarrow>=13",
  "requests>=2.31",
  "yfinance>=0.2.43",

  # Week 3 API stack (needed by deps-jlab-check)
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "prometheus_client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6",
  "mypy>=1.11",
  "ruff>=0.6.8",
  "types-requests>=2.31.0.10",   # mypy stubs (optional but nice)
]
hive = [
  "pyhive>=0.7.0",
  "thrift>=0.16",
  "thrift-sasl>=0.4.3",
  "pure-sasl>=0.6.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Resolve imports relative to these roots
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks", "dq", "data", "hadoop-conf"]

[tool.ruff.lint]
extend-select = ["I"]  # isort

[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
