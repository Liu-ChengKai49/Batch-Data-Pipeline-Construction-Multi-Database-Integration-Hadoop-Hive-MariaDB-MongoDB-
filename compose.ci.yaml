services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: demo
      MARIADB_USER: demo
      MARIADB_PASSWORD: demo
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:6
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD","mongosh","--eval","db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 30
